services:
  # Instancia aislada: las pruebas no cambian el modo del servicio habitual.
  payments-test:
    profiles: [test]
    build:
      context: ./backend
      dockerfile: Dockerfile.payments
    environment:
      PAYMENTS_MODE: demo
      PAYMENTS_API_KEY: "${PAYMENTS_API_KEY:?Define PAYMENTS_API_KEY en .env}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 15
  backend-tests:
    profiles: [test]
    build:
      context: ./backend
      target: test
    environment:
      PAYMENTS_MODE: demo
      PAYMENTS_API_KEY: "${PAYMENTS_API_KEY:?Define PAYMENTS_API_KEY en .env}"
      TEST_PAYMENTS_SERVICE_URL: http://payments-test:8001
      DATABASE_URL: "postgresql://julia:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}@db:5432/julia"
      BACKEND_API_KEY: "${BACKEND_API_KEY:?Define BACKEND_API_KEY en .env}"
    depends_on:
      backend:
        condition: service_healthy
      payments-test:
        condition: service_healthy
